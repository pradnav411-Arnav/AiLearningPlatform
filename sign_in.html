<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./auth-modal.css">
</head>
<body>

  <header class="scoreboard-header">
    <nav>
            <ul class="topnav">
                <li><img src="./photos/logo.svg" alt="Logo"></li>
                <li><a href="index.html">Home</a></li>
                <li><a href="MissionPage.html">Mission Page</a></li>
                <li><a href="LearningHub.html">Learning Hub</a></li>
                <li><a href="Scoreboard.html">Scoreboard</a></li>
                <li><a href="References.html">References</a></li>
                <li><a href="Progression.html">Progressions</a></li>
                <li class="right_nav"><a href="./signUp.html">Get Started</a></li>
                <li class="right_nav">
                  <a href="#signInModal" id="openSignInBtn" class="sign_in">Sign In</a>
                </li>
                
            </ul>
        </nav>
  </header>

  <div class="row" style="margin-top: 40px;">
    <div class="header-content" style="height: auto; padding: 30px; width: 600px; margin: 0 auto;">
      <h2 style="color: white; margin-top: 0;">Account Sign In</h2>
      
        <form id="signInForm">
          <input type="email" id="signInEmail" class="portal-input"
                placeholder="Email" aria-label="Email" autocomplete="username" required style="width: 60%;"><br><br>

          <input type="password" id="signInPassword" class="portal-input"
                placeholder="Password" aria-label="Password" autocomplete="current-password" required style="width: 60%;"><br><br>

          <button type="submit" class="portal-btn">Sign In</button>
        </form>
        <br>
      <button class="portal-btn" onclick="window.location.href='signUp.html'">Create Account Instead</button><br>
      
      <p id="status" role="status" aria-live="polite" style="font-weight: bold; color: #333; margin-top: 15px;"></p>
    </div>
  </div>

  <script type="module" src="./scripts/loginAndSignUp.js"></script>

</body>
</html>
