<!DOCTYPE html>
<html>
<head>
  <title>Sign In</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <header>
    <ul class="topnav">
      <li><a href="index.html">Home</a></li>
      <li><a href="MissionPage.html">Mission Page</a></li>
      <li><a href="Scoreboard.html">Scoreboard</a></li>
      <li class="right_nav"><a href="sign_in.html" class="sign_in">Sign In</a></li>
    </ul>
  </header>

  <div class="row" style="margin-top: 40px;">
    <div class="header-content" style="height: auto; padding: 30px; width: 600px; margin: 0 auto;">
      <h2 style="color: white; margin-top: 0;">Account Sign In</h2>
      
      <input type="text" id="user" class="portal-input" placeholder="Username" style="width: 60%;"><br><br>
      <input type="password" id="pass" class="portal-input" placeholder="Password" style="width: 60%;"><br><br>
      
      <button class="portal-btn" onclick="signIn()">Sign In</button><br><br>
      <button class="portal-btn" onclick="window.location.href='signUp.html'">Create Account Instead</button><br>
      
      <p id="status" style="font-weight: bold; color: white; margin-top: 15px;"></p>
    </div>
  </div>

  <script>
    function getUsers() {
      return JSON.parse(localStorage.getItem('portal_users')) || [];
    }

    function signIn() {
      let u = document.getElementById('user').value;
      let p = document.getElementById('pass').value;
      let users = getUsers();
      let valid = users.find(user => user.username === u && user.password === p);

      if (valid) {
        localStorage.setItem('currentUser', u);
        document.getElementById('status').innerText = "Logged in as: " + u;
        alert("Signed in successfully!");
      } else {
        alert("Invalid username or password.");
      }
    }
  </script>

</body>
</html>
