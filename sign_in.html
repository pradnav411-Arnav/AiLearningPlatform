<!DOCTYPE html>
<html>
<head>
  <title>Sign In</title>
  <style>
    body { text-align: center; }
  </style>
</head>
<body>

  <h1>AI Learning Portal</h1>
  <p>
    <a href="HomePage.html">Home</a> | 
    <a href="MissionPage.html">Mission Page</a> | 
    <a href="Scoreboard.html">Scoreboard</a> |
    <a href="Login.html">Sign In</a>
  </p>
  <hr>

  <h2>Account Sign In</h2>
  <input type="text" id="user" placeholder="Username"><br><br>
  <input type="password" id="pass" placeholder="Password"><br><br>
  
  <button onclick="createAccount()">Create Account</button>
  <button onclick="signIn()">Sign In</button>
  
  <p id="status" style="font-weight: bold;"></p>

  <script>


  async function signInWithEmail() {
    const { data, error } = await supabase.auth.signInWithPassword({
      email: 'valid.email@supabase.io',
      password: 'example-password',
    })
  }

    //Old SignUp
    function createAccount() {
      let u = document.getElementById('user').value;
      let p = document.getElementById('pass').value;
      if (!u || !p) return alert("Enter username and password");
      
      localStorage.setItem(u, p);
      alert("Account created successfully!");
    }

    function signIn() {
      let u = document.getElementById('user').value;
      let p = document.getElementById('pass').value;
      
      if (localStorage.getItem(u) === p) {
        document.getElementById('status').innerText = "Logged in as: " + u;
        localStorage.setItem('currentUser', u); // Save login state for other pages
      } else {
        alert("Invalid username or password.");
      }
    }
  </script>

</body>
</html>
