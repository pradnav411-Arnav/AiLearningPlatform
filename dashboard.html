<!DOCTYPE html>
<html lang="en">
<head>
    <script type="module">
import { supabaseClient as db } from "./scripts/supabaseClient.js";

const profileForm = document.getElementById("profile-form");
const avatarForm = document.getElementById("avatar-form");
const usernameInput = document.getElementById("profile-username");
const emailInput = document.getElementById("profile-email");
const avatarPreview = document.getElementById("current-avatar");
const statusText = document.getElementById("profile-status");
const avatarStatus = document.getElementById("avatar-status");
const saveButton = document.getElementById("save-profile");
const avatarButton = document.getElementById("save-avatar");
const welcomeName = document.getElementById("username");

const avatarPaths = {
  1: "./photos/avatar1.jpg",
  2: "./photos/avatar2.jpg",
  3: "./photos/avatar3.jpg"
};
let currentUserId = null;
let profileReady = false;
saveButton.disabled = true;
avatarButton.disabled = true;

async function loadProfile() {
  try {
    const { data: { user }, error: authError } = await db.auth.getUser();
    if (authError || !user) {
      window.location.replace("./sign_in.html");
      return;
    }
    currentUserId = user.id;
    emailInput.value = user.email ?? "";
    let { data: profile, error } = await db
      .from("profiles")
      .select("username, avatar_id")
      .eq("id", currentUserId)
      .maybeSingle();
    if (error) throw error;

    if (!profile) {
      const defaultUsername = user.user_metadata?.username ||
        "player_" + user.id.replace(/-/g, "").slice(0, 16);
      const result = await db.from("profiles").insert({
        id: currentUserId,
        username: defaultUsername,
        avatar_id: 1
      }).select("username, avatar_id").single();
      if (result.error) throw result.error;
      profile = result.data;
    }

    usernameInput.value = profile.username ?? "";
    welcomeName.textContent = profile.username || user.user_metadata?.username || user.email;
    const avatarId = Object.hasOwn(avatarPaths, profile.avatar_id) ? profile.avatar_id : 1;
    document.querySelector('input[name="avatar"][value="' + avatarId + '"]').checked = true;
    avatarPreview.src = avatarPaths[avatarId];
    profileReady = true;
    saveButton.disabled = false;
    avatarButton.disabled = false;
  } catch (error) {
    statusText.textContent = "Unable to load profile: " + error.message;
    avatarStatus.textContent = "Load your profile before saving an avatar.";
  }
}

document.querySelectorAll('input[name="avatar"]').forEach(input => {
  input.addEventListener("change", () => {
    avatarPreview.src = avatarPaths[Number(input.value)];
    avatarStatus.textContent = "Preview only. Confirm to save your avatar.";
  });
});

// Each form sends only its own field to the database.
async function saveField(changes, button, status, successMessage) {
  if (!profileReady) return false;
  button.disabled = true;
  status.textContent = "Saving...";
  try {
    const { error } = await db.from("profiles")
      .update(changes).eq("id", currentUserId).select("id").single();
    if (error) throw error;
    status.textContent = successMessage;
    return true;
  } catch (error) {
    status.textContent = error.code === "23505"
      ? "Username is already taken."
      : "Unable to save: " + error.message;
    return false;
  } finally {
    button.disabled = false;
  }
}

profileForm.addEventListener("submit", async event => {
  event.preventDefault();
  const username = usernameInput.value.trim();
  if (!/^[A-Za-z0-9_]{3,24}$/.test(username)) {
    statusText.textContent = "Username must be 3-24 letters, numbers, or underscores.";
    return;
  }
  const saved = await saveField({ username }, saveButton, statusText, "Username saved!");
  if (saved) {
    usernameInput.value = username;
    welcomeName.textContent = username;
  }
});

avatarForm.addEventListener("submit", async event => {
  event.preventDefault();
  const selected = avatarForm.querySelector('input[name="avatar"]:checked');
  const avatarId = Number(selected?.value);
  if (!Object.hasOwn(avatarPaths, avatarId)) {
    avatarStatus.textContent = "Choose an avatar first.";
    return;
  }
  await saveField({ avatar_id: avatarId }, avatarButton, avatarStatus, "Avatar saved!");
});

loadProfile().then(loadProgress);

// Progress is read from Supabase; this page never awards or changes XP.
async function loadProgress() {
  const status = document.getElementById("progress-status");
  const refresh = document.getElementById("refresh-progress");
  if (!currentUserId) {
    status.textContent = "Sign in to see your progress.";
    return;
  }
  refresh.disabled = true;
  status.textContent = "Loading your progress...";
  try {
    const { data: profile, error } = await db.from("profiles")
      .select("xp, level").eq("id", currentUserId).single();
    if (error) throw error;
    const xp = Number(profile.xp ?? 0);
    const level = Number(profile.level ?? 1);
    if (!Number.isFinite(xp) || !Number.isFinite(level)) {
      throw new Error("Your progress contains invalid values.");
    }
    document.getElementById("dashboard-xp").textContent = xp.toLocaleString();
    document.getElementById("dashboard-level").textContent = level.toLocaleString();
    const levelXP = Math.max(0, xp) % 100;
    const bar = document.getElementById("dashboard-xp-bar");
    bar.setAttribute("aria-valuenow", String(levelXP));
    bar.setAttribute("aria-valuetext", `${levelXP} of 100 XP toward the next level`);
    document.getElementById("dashboard-xp-fill").style.width = `${levelXP}%`;
    document.getElementById("dashboard-xp-detail").textContent = `${levelXP.toLocaleString()} / 100 XP toward next level`;
    status.textContent = "Your latest saved progress.";
  } catch (error) {
    document.getElementById("dashboard-xp").textContent = "—";
    document.getElementById("dashboard-level").textContent = "—";
    const bar = document.getElementById("dashboard-xp-bar");
    bar.removeAttribute("aria-valuenow");
    bar.setAttribute("aria-valuetext", "Progress unavailable");
    document.getElementById("dashboard-xp-fill").style.width = "0%";
    document.getElementById("dashboard-xp-detail").textContent = "";
    status.textContent = "Unable to load progress: " + error.message;
  } finally {
    refresh.disabled = false;
  }
}

document.getElementById("refresh-progress").addEventListener("click", loadProgress);


</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <style>

            background-image: none;
            color: white;

        }

        header ul.topnav {

        }

        h1, h2 {
            text-align: left;
            padding-left: 50px;
            margin-top: 20px;
            padding-bottom: 0px;
        }

        h2 {
            padding-top: 0px;
            font-family: Arial, sans-serif;
        }


        input {
            border-radius: 20px;
            border: 1px solid #c0c0c0;
            outline: 0 !important;
            box-sizing: border-box;
            padding: 12px 15px;
        }

        #save-profile, #save-avatar {
            background-color: #51c9a5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
        }        .input {
            border-radius: 20px;
            border: 1px solid #c0c0c0;
            outline: 0 !important;
            box-sizing: border-box;
            padding: 12px 15px;
        }


        /* Profile */
        .profile-settings {
            margin: 40px;
            max-width: 300px;
            padding: 24px;
            border: 5px solid #334c53;
            border-radius: 26px;
        }

        #current-avatar {
        width: 100px;
        height: 100px;
        object-fit: cover;
        border-radius: 50%;
        }

        .avatar-options {
        display: flex;
        gap: 16px;
        margin: 16px 0;
        }

        .avatar-choice {
        cursor: pointer;
        position: relative;
        }

        .avatar-choice input {
        position: absolute;
        opacity: 0;
        }

        .avatar-choice img {
        width: 80px;
        height: 80px;
        object-fit: cover;
        border-radius: 16px;
        border: 2px solid transparent;
        transition: 0.2s ease;
        }

        .avatar-choice:hover img {
        transform: translateY(-4px);
        }

        .avatar-choice input:checked + img {
        border-color: #51c9a5;
        }

        .avatar-choice input:focus-visible + img {
        outline: 3px solid #51c9a5;
        outline-offset: 3px;

        }

        @font-face {
            font-family: 'Press Start 2P';
            src: url('./fonts/press-start-2p/PressStart2P-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        .dashboard-progress {
            min-width: 0;
            padding: 24px 0;
            color: #244d57;
        }

        .progress-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .dashboard-progress h2 {
            margin: 0;
            padding: 0;
            color: #426160;
            font: 400 24px 'Talina', Arial, sans-serif;
        }

        #refresh-progress {
            padding: 8px 16px;
            border: 1px solid #368abd;
            border-radius: 2px;
            background: #2995d4;
            color: #fff;
            font: 600 14px Arial, sans-serif;
            cursor: pointer;
        }

        #refresh-progress:hover { background: #56a2cb; }
        #refresh-progress:focus-visible {
            outline: 3px solid #116a9f;
            outline-offset: 4px;
        }
        #refresh-progress:disabled { opacity: 0.6; cursor: wait; }

        .xp-display {
            margin: 32px 0 24px;
            padding: 8px 6px;
            color: #116a9f;
            font: 400 clamp(28px, 3.7vw, 48px)/1.6 'Press Start 2P', monospace;
            letter-spacing: -2px;
            overflow-wrap: anywhere;
            text-shadow:
                -3px -3px 0 #fff, 3px -3px 0 #fff,
                -3px 3px 0 #fff, 3px 3px 0 #fff,
                0 5px 0 #c9e5e7;
        }

        /* Each level spans 100 XP; the fill shows progress within that level. */
        .xp-bar {
            height: 24px;
            border: 2px solid #244d57;
            border-radius: 7px;
            overflow: hidden;
            background: #e0edf0;
            box-shadow: inset 0 2px 3px rgba(36, 77, 87, 0.12), 0 4px 0 #c9e5e7;
        }

        .xp-bar-fill {
            display: block;
            width: 0;
            height: 100%;
            background: linear-gradient(180deg, #86d8f6 0%, #368abd 100%);
            box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.55);
            transition: width 300ms ease;
        }

        .xp-detail {
            min-height: 1.5em;
            margin: 12px 0 0;
            color: #426160;
            font: 14px/1.5 Arial, sans-serif;
        }

        @media (prefers-reduced-motion: reduce) {
            .xp-bar-fill { transition: none; }
        }

        .current-level {
            margin: 22px 0 0;
            text-align: right;
            color: #244d57;
            font: 400 clamp(22px, 2.4vw, 30px)/1.4 'Talina', Arial, sans-serif;
        }

        #progress-status {
            margin: 14px 0 0;
            color: #426160;
            font: 14px/1.6 Arial, sans-serif;
        }

        @media (max-width: 500px) {
            .dashboard-progress { padding: 16px 0; }
            .dashboard-progress h2 { font-size: 21px; }
            .xp-display { font-size: 28px; letter-spacing: -1px; }
        }
        .dashboard-layout {
            display: grid;
            grid-template-columns: minmax(0, 358px) minmax(0, 658px);
            grid-template-areas: "profile progress";
            justify-content: space-between;
            align-items: start;
            gap: 32px;
            margin: 32px 24px 40px 40px;
        }

        #dashboard-level {
            font-family: 'Press Start 2P', monospace;
            font-weight: 400;
            /* Match the pixel font's visible baseline to Talina's lettering. */
            vertical-align: -0.14em;
        }
        .dashboard-layout > .profile-settings { grid-area: profile; margin: 0; max-width: none; }
        .dashboard-layout > .dashboard-progress { grid-area: progress; margin: 0; max-width: none; }
        @media (max-width: 900px) {
            .dashboard-layout {
                grid-template-columns: minmax(0, 1fr);
                grid-template-areas: "profile" "progress";
                margin: 24px 16px;
            }
            .dashboard-layout > .profile-settings { max-width: 300px; }
        }
    </style>
</head>
